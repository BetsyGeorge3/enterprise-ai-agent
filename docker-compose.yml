services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      MCP_TOOLS_URL: http://mcp-tools:8080/mcp
    volumes:
      - ./uploaded_files:/app/uploaded_files
    depends_on:
      - mcp-tools

  mcp-tools:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    ports:
      - "8080:8080"
    env_file: .env

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
