# .github/workflows/deploy.yml
name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug env presence
        run: |
          if [ -z "$AZURE_OPENAI_ENDPOINT" ]; then echo "AZURE_OPENAI_ENDPOINT is MISSING"; else echo "AZURE_OPENAI_ENDPOINT is PRESENT (length: ${#AZURE_OPENAI_ENDPOINT})"; fi
          if [ -z "$AZURE_OPENAI_KEY" ]; then echo "AZURE_OPENAI_KEY is MISSING"; else echo "AZURE_OPENAI_KEY is PRESENT (length: ${#AZURE_OPENAI_KEY})"; fi
          if [ -z "$AZURE_OPENAI_DEPLOYMENT" ]; then echo "AZURE_OPENAI_DEPLOYMENT is MISSING"; else echo "AZURE_OPENAI_DEPLOYMENT is PRESENT (length: ${#AZURE_OPENAI_DEPLOYMENT})"; fi
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}

      - name: Run evaluation suite
        env:
          SKIP_MCP_LOCAL_TESTS: "true"
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}
          AZURE_SEARCH_KEY: ${{ secrets.AZURE_SEARCH_KEY }}
          AZURE_SEARCH_INDEX: ${{ secrets.AZURE_SEARCH_INDEX }}
          COSMOS_CONNECTION_STRING: ${{ secrets.COSMOS_CONNECTION_STRING }}
          COSMOS_DATABASE: ${{ secrets.COSMOS_DATABASE }}
          COSMOS_CONTAINER: ${{ secrets.COSMOS_CONTAINER }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_BLOB_CONTAINER: ${{ secrets.AZURE_BLOB_CONTAINER }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          KEY_VAULT_URL: ${{ secrets.KEY_VAULT_URL }}
        run: |
          python -m evaluation.metrics
          python -m evaluation.test_mcp_cases

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/backend:${{ github.sha }} -f backend/Dockerfile .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/backend:${{ github.sha }}

      - name: Build and push mcp-tools
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/mcp-tools:${{ github.sha }} -f mcp_server/Dockerfile .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/mcp-tools:${{ github.sha }}

      - name: Deploy backend to Container Apps
        run: |
          az containerapp update \
            --name backend \
            --resource-group rg-enterprise-ai-agent \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/backend:${{ github.sha }}

      - name: Deploy mcp-tools to Container Apps
        run: |
          az containerapp update \
            --name mcp-tools \
            --resource-group rg-enterprise-ai-agent \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/mcp-tools:${{ github.sha }}